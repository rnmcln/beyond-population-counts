[study]
title = "Population ageing and inpatient care for neurosurgically relevant conditions in Germany to 2040: age-structured versus population-based projections"
outcome_label = "inpatient utilisation"
baseline_year = 2024
historical_start_year = 2005
primary_horizon = 2035
secondary_horizons = [2030, 2040]
projection_scenario = "G2L2W2"
geography = "Germany"

[age_harmonization]
topcode = 85
reason = "Coarsest stable upper-age category in the national observed-population denominator"

[models]
run_model_0 = true
run_model_1 = true
run_negative_binomial = false
rate_scale = 100000

[backtest]
minimum_training_years = 5
horizons = [1, 3, 5]

[paths]
diagnoses = "data/processed/diagnoses.csv"
population_observed = "data/processed/population_observed.csv"
population_projected = "data/processed/population_projected.csv"
diagnosis_codebook = "metadata/diagnosis_codebook.csv"
output_tables = "outputs/tables"
output_figures = "outputs/figures"
output_logs = "outputs/logs"
